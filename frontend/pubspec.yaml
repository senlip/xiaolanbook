name: xiaolanbook
description: "短视频 + 图文笔记社区 — Flutter 客户端（Android + iOS 同步）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 网络
  dio: ^5.7.0

  # 安全存储（保存 JWT）
  flutter_secure_storage: ^9.2.2

  # 路由
  go_router: ^14.2.7

  # 工具
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true